name: StickFable 5.1 APK

on:
  push:
    branches: ["**"]
    paths:
      - "stickfable-app/**"
      - "stick-survival-game/**"
      - ".github/workflows/stickfable.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build StickFable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Sync game to Android assets
        run: |
          set -e
          echo "Syncing stick-survival-game/index.html to stickfable-app assets..."
          cp stick-survival-game/index.html stickfable-app/app/src/main/assets/index.html
          test -s stickfable-app/app/src/main/assets/index.html
          SIZE=$(wc -c < stickfable-app/app/src/main/assets/index.html)
          echo "Game size: $SIZE bytes"
          test "$SIZE" -gt 50000 || { echo "Game file too small, looks broken"; exit 1; }
          grep -q "STICKFABLE" stickfable-app/app/src/main/assets/index.html
          grep -q "three" stickfable-app/app/src/main/assets/index.html
          echo "Assets OK"

      - name: Build APK (debug-signed, installable)
        working-directory: stickfable-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### StickFable APK build failed"
            echo "Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "**Errors:**"
            echo '```'
            grep -E "^e: |error:" /tmp/build.log | head -50
            echo '```'
            echo "**Log tail:**"
            echo '```gradle'
            tail -c 4000 /tmp/build.log
            echo '```'
          } | gh issue create \
                --title "❌ StickFable APK build failed (${GITHUB_SHA:0:7})" \
                --body-file - \
                --repo "${REPO}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: StickFable-5.1-debug-apk
          path: stickfable-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cp stickfable-app/app/build/outputs/apk/debug/*.apk /tmp/StickFable-5.1.apk
          gh release view stickfable-apk-latest --repo "${REPO}" >/dev/null 2>&1 || \
            gh release create stickfable-apk-latest --repo "${REPO}" \
                --title "StickFable 5.1 — Android APK (Claude Edition)" \
                --notes "Auto-built StickFable 5.1 Claude Edition. Debug-signed, installable. Fable-inspired RPG with morality, dog, demon doors, silver keys, marriage, property. Commit: ${SHA}"
          gh release upload stickfable-apk-latest /tmp/StickFable-5.1.apk --repo "${REPO}" --clobber
          echo "APK live at: https://github.com/${REPO}/releases/tag/stickfable-apk-latest"
