name: Build AI Brain Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag for APK'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android Manifest & Kotlin Code
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "BrainBubbleService" android/app/src/main/AndroidManifest.xml
          grep -q "BrainAccessibilityService" android/app/src/main/AndroidManifest.xml
          grep -q "BrainShareTargetActivity" android/app/src/main/AndroidManifest.xml
          grep -q "BrainProcessTextActivity" android/app/src/main/AndroidManifest.xml
          grep -q "BrainVoiceInteractionService" android/app/src/main/AndroidManifest.xml
          echo "Android components and manifest verified."

      - name: Build APK (signed, installable)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibrain-signed-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          tag_name: ${{ github.event.inputs.release_version || 'v1.0.0' }}
          name: AI Brain Android APK ${{ github.event.inputs.release_version || 'v1.0.0' }}
          body: |
            ## 🧠 AI Brain Universal Android APK (සිංහල + English)
            - 🫧 Floating Bubble (SYSTEM_ALERT_WINDOW)
            - 👁️ Accessibility Service with Consent Indicator
            - 📝 Global Text Selection Context Action (PROCESS_TEXT)
            - 📤 Share-Sheet Target (ACTION_SEND)
            - 🎙️ Bilingual Voice Input/Output (Sinhala & English)
            - ☁️ Shared Cloud Memory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
