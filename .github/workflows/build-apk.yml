name: Build AI Brain Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version tag for APK'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android Manifest & Kotlin Code
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "BrainBubbleService" android/app/src/main/AndroidManifest.xml
          grep -q "BrainAccessibilityService" android/app/src/main/AndroidManifest.xml
          grep -q "BrainShareTargetActivity" android/app/src/main/AndroidManifest.xml
          grep -q "BrainProcessTextActivity" android/app/src/main/AndroidManifest.xml
          grep -q "BrainVoiceInteractionService" android/app/src/main/AndroidManifest.xml
          echo "Android components and manifest verified."

      - name: Build APK (signed, installable)
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibrain-signed-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct Download Link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk /tmp/AIBrain.apk
          gh release view aibrain-apk-latest --repo "${REPO}" >/dev/null 2>&1 || \
            gh release create aibrain-apk-latest --repo "${REPO}" \
                --title "AI Brain — Universal Android APK (සිංහල + English)" \
                --notes "Auto-built signed APK for AI Brain. Features: Floating Bubble, Accessibility Service, Text Selection, Share Target, and Shared Cloud Memory."
          gh release upload aibrain-apk-latest /tmp/AIBrain.apk --repo "${REPO}" --clobber
          echo "APK is live at: https://github.com/${REPO}/releases/tag/aibrain-apk-latest"
